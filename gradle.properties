org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# The build cache: a task whose inputs and code are unchanged is taken from it, which is most of a rebuild's time.
org.gradle.caching=true
# The configuration cache: the build's setup is done once and kept, so a build that only compiles does not configure
# everything again. Some plugins do not support it yet, and the build says so rather than failing.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
