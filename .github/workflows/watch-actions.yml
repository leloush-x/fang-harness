name: Watch actions

# A cron job that watches the repository's other workflows. A run that failed on main is reported in an issue, so a
# broken build is noticed without watching the Actions page, and the report closes itself once the run is redone and
# passes. It reads the runs and writes issues; it never touches the code, and it never builds anything.
on:
  schedule:
    # Every half hour, off the hour and off the half: GitHub delays a scheduled run when the repository is busy, and
    # the runs this watches take a quarter of an hour.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-actions
  cancel-in-progress: false

jobs:
  watch:
    name: Watch the workflow runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Report the runs that failed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const PREFIX = "CI failed: ";
            const SHA_MARKER = /<!--\s*sha:([0-9a-f]{7,40})\s*-->/;
            const LOOKBACK_MS = 24 * 60 * 60 * 1000;

            // The runs of the last day, so a report is about something that just happened rather than about
            // whatever failed last month.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: "main",
              created: `>=${new Date(Date.now() - LOOKBACK_MS).toISOString()}`,
              per_page: 100,
            });
            const failed = runs.filter((run) => run.conclusion === "failure" && run.name !== "Watch actions");
            // A commit whose run was redone and passed needs no report, whichever run failed first.
            const passed = new Set(runs.filter((run) => run.conclusion === "success").map((run) => run.head_sha));

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const ours = issues.filter((issue) => issue.title.startsWith(PREFIX));

            // The report of a commit that passed when it was redone.
            for (const issue of ours) {
              if (issue.state !== "open") continue;
              const sha = SHA_MARKER.exec(issue.body ?? "")?.[1];
              if (sha === undefined || !passed.has(sha)) continue;
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              core.info(`Closed the report for ${sha.slice(0, 7)}, which passed.`);
            }

            // The report of a commit that failed and has none yet. A commit is reported once: a report that was
            // closed is not reopened, so a still-red build stays one issue rather than one per run.
            const reported = new Set(
              ours.map((issue) => SHA_MARKER.exec(issue.body ?? "")?.[1]).filter((sha) => sha !== undefined),
            );
            for (const run of failed) {
              const sha = run.head_sha;
              if (reported.has(sha)) continue;
              if (passed.has(sha)) continue;
              reported.add(sha);
              const title = `${PREFIX}${run.name} (${sha.slice(0, 7)})`;
              const body = [
                `<!-- sha:${sha} -->`,
                `The **${run.name}** workflow failed on \`main\`.`,
                "",
                `- Commit: ${sha}`,
                `- Run: ${run.html_url}`,
                `- Failed at: ${run.updated_at}`,
                "",
                "Pushing to `main` runs the workflow again; this report closes itself when that run passes.",
              ].join("\n");
              await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Reported ${run.name} (${sha.slice(0, 7)}).`);
            }
