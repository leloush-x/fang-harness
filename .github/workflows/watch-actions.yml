name: Watch actions

# A cron job that watches the repository's other workflows. A workflow that is red on main is reported in an issue, so
# a broken build is noticed without watching the Actions page, and the report closes itself once that workflow passes
# again. It reads the runs and writes issues; it never touches the code, and it never builds anything.
on:
  schedule:
    # Every half hour, off the hour and off the half: GitHub delays a scheduled run when the repository is busy, and
    # the runs this watches take a quarter of an hour.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  # Reading the runs needs actions: read; without it the API answers 403.
  actions: read
  contents: read
  issues: write

concurrency:
  group: watch-actions
  cancel-in-progress: false

jobs:
  watch:
    name: Watch the workflow runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Report the runs that failed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const PREFIX = "CI failed: ";
            // The marker names the workflow the report is about, so a report is closed by that workflow's own
            // next result and not by another's. A report from an older watcher carries the commit as well, and
            // is closed just the same.
            const MARKER = /<!--\s*watched:([0-9]+)(?::[0-9a-f]{7,40})?\s*-->/;

            // The runs on main, newest first.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: "main",
              per_page: 100,
            });
            // The latest run of each workflow is the one that says how it stands now. A run still going says
            // nothing yet, so it is left out and the previous result stands.
            const latest = new Map();
            for (const run of runs) {
              if (run.status !== "completed") continue;
              if (run.name === "Watch actions") continue;
              if (!latest.has(run.workflow_id)) latest.set(run.workflow_id, run);
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const ours = issues.filter((issue) => issue.title.startsWith(PREFIX));
            // The report of each workflow, by the workflow it is about. A workflow that failed several times has
            // a report for each of them; only one of them is open at a time, but an old one may be left open.
            const reports = new Map();
            for (const issue of ours) {
              const marker = MARKER.exec(issue.body ?? "");
              if (marker === null) continue;
              const forWorkflow = reports.get(marker[1]) || [];
              forWorkflow.push(issue);
              reports.set(marker[1], forWorkflow);
            }

            // A workflow that passes again closes its reports: the build is green now.
            for (const [workflow, forWorkflow] of reports) {
              const run = latest.get(workflow);
              if (run === undefined || run.conclusion !== "success") continue;
              for (const issue of forWorkflow) {
                if (issue.state !== "open") continue;
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
                core.info(`Closed the report for ${run.name}, which passed.`);
              }
            }

            // A workflow that is red now has one report, whichever commit it failed on.
            for (const [workflow, run] of latest) {
              if (run.conclusion !== "failure") continue;
              const open = (reports.get(workflow) || []).some((issue) => issue.state === "open");
              if (open) continue;
              const title = `${PREFIX}${run.name} (${run.head_sha.slice(0, 7)})`;
              const body = [
                `<!-- watched:${workflow} -->`,
                `The **${run.name}** workflow is failing on \`main\`.`,
                "",
                `- Commit: ${run.head_sha}`,
                `- Run: ${run.html_url}`,
                `- Failed at: ${run.updated_at}`,
                "",
                "Pushing to `main` runs the workflow again; this report closes itself when that run passes.",
              ].join("\n");
              await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Reported ${run.name} (${run.head_sha.slice(0, 7)}).`);
            }
