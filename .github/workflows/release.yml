name: Release

# Every push to main publishes a signed APK as GitHub release v0.0.N, where N, also the APK's versionCode, is one more
# than the latest release's. A rerun for a commit that already has a release reuses its version. The jobs split the work
# so that each credential is held by as little as possible:
#   build    runs ./gradlew check and builds the unsigned APK, with read-only repository access and no secrets, so
#            nothing the build runs, such as Gradle plugins or npm packages, can reach the signing key
#   sign     signs the APK with the release key from the `release` environment, which only main can deploy to
#   publish  creates the GitHub release, the only job allowed to write to the repository
#
# The `release` environment holds:
#   secrets    RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD
#   variables  RELEASE_KEY_ALIAS, RELEASE_CERT_SHA256
#
# Google Play fits beside these as its own jobs on the same version: the build job also runs :app:bundleRelease, a
# job in a `play` environment signs the bundle with the Play upload key, and another uploads it.

on:
  push:
    branches: [main]

permissions: {}

# Releases run one at a time, in order; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_TOOLS_VERSION: 37.0.0

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every release tag, to number this one after the latest.
          fetch-depth: 0
          fetch-tags: true

      - name: Choose version
        id: version
        run: |
          # The releases are 0.1.x, and the number starts at 10, so the first of them is 0.1.10.
          released=$(git tag --points-at HEAD --list 'v0.1.*' | sort -V | tail -n 1)
          if [ -n "$released" ]; then
            number=${released#v0.1.}
          else
            latest=$(git tag --list 'v0.1.*' | sed -n 's/^v0\.1\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
            number=$(( ${latest:-9} + 1 ))
          fi
          echo "Version 0.1.$number"
          echo "VERSION_NAME=0.1.$number" >> "$GITHUB_ENV"
          # The code is a hundred more than the number, so it stays above the codes of the 0.0 series: Android
          # refuses a build whose code is not higher than the one it would replace.
          echo "VERSION_CODE=$(( 100 + number ))" >> "$GITHUB_ENV"
          echo "name=0.1.$number" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: host/pnpm-lock.yaml

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      # The Gradle cache holds the dependencies and the build cache, which is most of what a build spends its time on.
      # It was turned off, so every release started from nothing. The action keys the cache by workflow and job, so a
      # release and a branch's run keep their own. No encryption key: the repository is private, so the cache is already
      # scoped to it, and a key would put a secret in a job that must not have one.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # check covers ktlint, detekt, Android lint, the unit tests and the host's checks; any failure stops the release.
      - name: Check and build
        run: >-
          ./gradlew check :app:assembleRelease
          -Pfang.versionName="$VERSION_NAME"
          -Pfang.versionCode="$VERSION_CODE"

      - name: Verify APK version
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/fang-unsigned.apk
          badging=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging dist/fang-unsigned.apk)
          if ! grep -q "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$badging"; then
            echo "The APK doesn't carry version $VERSION_NAME ($VERSION_CODE)" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: dist/fang-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/sign-release-apk.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION" > /dev/null'

      - name: Sign APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          mkdir dist
          # An unsigned APK cannot be installed, so there is no fallback here:
          # a release without a key fails instead of publishing something the
          # device will refuse.
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            scripts/sign-release-apk.sh unsigned/fang-unsigned.apk "dist/fang-v$VERSION_NAME.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: dist/fang-v*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build provenance attestation with Sigstore
      attestations: write # store the attestation
      artifact-metadata: write # link the attestation to the release asset
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.apk > SHA256SUMS

      # GitHub only offers build provenance attestations to private repositories on Enterprise plans.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*.apk

      - name: Publish release
        run: |
          if gh release view "v$VERSION_NAME" > /dev/null 2>&1; then
            echo "Release v$VERSION_NAME already exists"
            exit 0
          fi
          # GitHub answers 403 now and then when it is busy, and a release that is built and signed but never
          # published is lost. The step tries again before it gives up.
          for attempt in 1 2 3 4; do
            if gh release create "v$VERSION_NAME" dist/*.apk dist/SHA256SUMS \
              --title "Fang Harness $VERSION_NAME" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --latest; then
              exit 0
            fi
            echo "Publishing v$VERSION_NAME failed (attempt $attempt); trying again"
            sleep $((attempt * 5))
          done
          echo "Could not publish v$VERSION_NAME"
          exit 1
